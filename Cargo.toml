[package]
name = "whole_body_differential_drive_trajectory_generation"
version = "0.1.0"
edition = "2024"

[lib]
name = "wbdd"
path = "src/lib.rs"

[dependencies]
clarabel = "0.11"
emath = "0.35.0"
k = "0.32.0"
rand = "0.10.2"
rerun = "0.34.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[profile.dev]
opt-level = 1
