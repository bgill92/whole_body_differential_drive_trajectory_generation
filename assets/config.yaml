urdf_path: assets/rox_diff_ur5e.urdf
end_joint: ur5ewrist_3_joint

# Waypoint poses in the world frame, linearly interpolated (translation lerp,
# rotation slerp) into poses_per_segment poses per segment. rpy is
# roll-pitch-yaw in radians.
path:
  poses_per_segment: 10
  # Debug: only solve the first pose of the interpolated path.
  solve_first_pose_only: false
  waypoints:
    - xyz: [1.0, 1.0, 1.0]
      rpy: [3.14159265358979, 0.0, 0.0]
    - xyz: [1.0, -1.0, 1.0]
      rpy: [3.14159265358979, 0.0, 0.0]

# Differential IK loop.
differential_ik:
  num_steps: 25
  damping_factor: 0.5
  convergence_threshold: 0.01
  # Applied to the first pose solve only; subsequent poses solve unconstrained.
  equality_constraints:
    - joint_name: ur5eshoulder_pan_joint
      target_value: -1.57079
    - joint_name: ur5eelbow_joint
      target_value: 1.57079
