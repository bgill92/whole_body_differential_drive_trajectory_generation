urdf_path: assets/rox_diff_ur5e.urdf
end_joint: ur5ewrist_3_joint

# Goal pose in the world frame. rpy is roll-pitch-yaw in radians.
goal:
  xyz: [1.0, 1.0, 1.0]
  rpy: [3.14159265358979, 0.0, 0.0]

solver:
  allowable_target_distance: 0.01
  allowable_target_angle: 0.01
  jacobian_multiplier: 0.5
  num_max_try: 100

# Differential IK loop.
differential_ik:
  num_steps: 25
  pseudo_inverse_epsilon: 0.000001
  step_size: 0.5
